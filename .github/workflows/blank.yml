name: Patch and Build Folia

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    # Only run on PRs if the source branch is on someone else's repo (fork PRs)
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # важно для патчей

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Git User Details
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace

      - name: Build Paperclip JAR (Folia kernel)
        run: ./gradlew createMojmapPaperclipJar --stacktrace

      - name: Upload Folia JAR
        uses: actions/upload-artifact@v4
        with:
          name: folia-server-jar
          path: build/libs/folia-*-*.jar
          if-no-files-found: error
          retention-days: 30
